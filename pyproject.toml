[project]
name = "aria-pep"
version = "0.1.0"
description = "PEP reservation drops to PMS stay nights and reservation-night OTB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aria-runner",
    "pep-connector",
]

[tool.uv.workspace]
members = ["packages/pep-connector"]

[tool.uv.sources]
pep-connector = { workspace = true }
aria-runner = { path = "../aria-runner" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["packages/pep-connector/tests"]
