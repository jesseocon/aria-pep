[project]
name = "pep-connector"
version = "0.1.0"
description = "Heal PEP reservation exports and load them for aria-runner."
requires-python = ">=3.11"
dependencies = [
    "aria-runner",
    "dbt-bigquery>=1.8,<2",
    "google-api-python-client>=2",
    "google-auth>=2",
    "google-cloud-bigquery>=3",
]

[project.entry-points."aria_runner.connectors"]
pep = "pep_connector:connector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pep_connector"]
